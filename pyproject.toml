[project]
name = "kantorai-laporan"
version = "0.1.0"
description = "Tim agent laporan pagi: 4 pelapor, analis, koordinator, dashboard."
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.2",
  "openai>=1.40",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "PyYAML>=6",
  "fastapi>=0.110",
  "jinja2>=3.1",
  "itsdangerous>=2.1",
  "python-multipart>=0.0.9",
  "uvicorn>=0.29",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
laporan = "laporan.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["laporan*"]

[tool.setuptools.package-data]
laporan = ["prompts/*.md", "web/templates/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
