# Pakai file ini bila VPS SUDAH memakai nginx (web lama tetap jalan, tidak disentuh).
# Ganti domain di bawah, simpan ke /etc/nginx/sites-available/kantorai,
# lalu: ln -s ../sites-available/kantorai /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# HTTPS: certbot --nginx -d laporan.qukis.web.id -d kantor.qukis.web.id
server {
    listen 80;
    server_name laporan.qukis.web.id;
    location / {
        proxy_pass http://127.0.0.1:8710;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 80;
    server_name kantor.qukis.web.id;
    location / {
        proxy_pass http://127.0.0.1:8712;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }
}
