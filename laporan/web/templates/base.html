<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Laporan Pagi{% endblock %}</title>
<style>
:root{--bg:#F4F6F3;--card:#fff;--ink:#18221C;--muted:#5D6A63;--line:#D6DDD8;--accent:#2E6B4C;--ok:#2E7D4F;--warn:#B7791F;--bad:#B83A2E;--warn-bg:#FDF3E1;--bad-bg:#F9E2DF;--ok-bg:#E3F1E8}
@media (prefers-color-scheme:dark){:root{--bg:#111814;--card:#18221D;--ink:#E6EDE8;--muted:#98A69E;--line:#2F3D35;--accent:#7CC29C;--ok:#7CC29C;--warn:#F0B55E;--bad:#F08A7E;--warn-bg:#3A2D16;--bad-bg:#3B201C;--ok-bg:#1F3328}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px;display:grid;gap:20px}
h1{font-size:1.5rem;margin:0}h2{font-size:1.05rem;margin:0 0 8px}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.8rem;padding:4px 10px;border-radius:999px;background:var(--ok-bg);color:var(--ok);font-weight:600}
.chip.PERLU_DICEK{background:var(--warn-bg);color:var(--warn)}.chip.GAGAL{background:var(--bad-bg);color:var(--bad)}
ol,ul{margin:0;padding-left:20px;display:grid;gap:6px}
.tag{font-size:.72rem;padding:1px 6px;border-radius:4px;background:var(--warn-bg);color:var(--warn);margin-left:6px;white-space:nowrap}
details{border-top:1px solid var(--line);padding:10px 0}details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:600;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.num{font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:.9rem}td{padding:3px 0;border-bottom:1px solid var(--line);vertical-align:top}td:last-child{text-align:right}
.dates{display:flex;flex-wrap:wrap;gap:6px}.dates a{color:var(--accent);font-size:.85rem}
header{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
button,input{font:inherit}button{background:var(--accent);color:var(--card);border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
.linkbtn{background:none;color:var(--muted);padding:0;text-decoration:underline}
.err{color:var(--bad)}
</style>
</head>
<body><main>{% block body %}{% endblock %}</main></body>
</html>
